server:
  port: 8081

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  application:
    name: user-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/casino}
    username: ${DATABASE_USERNAME:casino}
    password: ${DATABASE_PASSWORD:casino}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_users
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

jwt:
  private-key: classpath:keys/private.pem
  public-key: classpath:keys/public.pem
  expiration: 60m

admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}

services:
  item-service:
    url: ${ITEM_SERVICE_URL:http://localhost:8083}
  internal-token: ${INTERNAL_SERVICE_TOKEN:local-internal-token}
